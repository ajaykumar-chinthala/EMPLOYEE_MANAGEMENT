<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMP</title>
    <style>
        *{
            margin: 0px;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        .nav{
            width: 100%;
            height: 70px;
            background-color: rgb(16, 19, 45);
            margin: 0px;
            position:fixed;
            top: 0px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            text-align: center;
            z-index: 100;
        }
        .content{
            width: 80%;
            height: auto;
            /* border: 2px solid red; */
            position: relative;
            top: 70px;
            margin-left: 10%;
            align-items: center;
            display: flex;
            flex-direction: column;
            z-index: 10;
            
        }
        .content-upper{
            width: 80%;
            height: 50px;
            /* border: 1px solid green; */
            margin-top: 10px;
            align-items: center;
            display: flex;
            /* justify-content: space-evenly; */
            justify-content: center;
            gap: 40px;
        }
        .content-upper button{
            background-color: rgb(237, 237, 245);
            border: 1px solid rgb(39, 37, 37);
            border-radius: 40px;
            padding: 5.5px 10px 5px 10px ;
            font-size: 12px;
            color: rgb(85, 85, 108);
            position: relative;
            top: 8px;
            cursor: pointer;
            transition: 0.15s ease;

        }
        .content-upper button:active{
            background-color:  rgb(47, 47, 143);
            color: white;
        }
        .content-lower{
            width: 100%;
            height: auto;
            /* border: 1px solid yellow; */
            margin-top: 20px;
            padding: 20px 0px ;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;

        }
        .card{
            width: 20%;
            height: 360px;
            /* border: 1px solid gray; */
            border-radius: 10px;
            padding: 10px 10px 20px 10px;
            background-color: white;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            box-shadow: 0px 2px 8px lightgray;

        }
        .pic{
            width: 90%;
            height: 50%;
            /* border: 1px solid violet; */
            background-color: rgb(241, 239, 239);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pic img{
            width: 90%;
            height: 90%;
            border-radius: 50%;
        }
        .idtxt{
            color:rgb(123, 125, 143);
            font-weight: bold;
            font-size: 13px;      
            /* line-height: 15px;     */
           
        }
        .name {
        
            color:rgb(16, 19, 45);
            font-weight: bold;
            font-size: 16px;      
            line-height: 15px;
        }
        .line{
            width: 99%;
            border: 0.5px solid rgb(184, 182, 182);
            line-height: 10px;
            border-left: none;
            border-bottom: none;
            border-right: none;
            background-color: white;
            color: white;

        }
        .gend{
            font-size: 13px;
            font-weight: bold;
            color:rgb(120, 120, 143);

        }
        .dept{
            font-size: 13px;
            font-weight: bold;
            color:rgb(120, 120, 143);
           
        }
        .attendstatus{
            padding: 5px 20px 6px 20px;
            font-size: 10px;
            border-radius: 40px;  
            border: none;


        }
        .view{
             font-weight: bold;
             font-size: 11px;
             color: white;
             background-color: rgb(12, 13, 15);
             padding: 8px 50px;
             border: none;
             border-radius: 10px;
             transition: opacity 0.15s;
             cursor: pointer;
             
        }
        .view:active{
          opacity: 0.3;

        }
        .viewb{
             font-weight: bold;
             font-size: 11px;
             color: white;
             background-color: rgb(243, 34, 34);
             padding: 8px 20px;
             border: none;
             border-radius: 10px;
             transition: opacity 0.15s;
             cursor: pointer;
             
        }
        .viewb:active{
          opacity: 0.3;

        }
        .cname{
             color:rgb(16, 19, 45);
            font-weight: bold;
            font-size: 16px;      
            line-height: 15px;
        }

        
    </style>
</head>
<body style="align-items: center;background-color: rgb(247, 247, 248);" >

    <div class="nav">
        <p style="color: white;font-weight: bold;font-size: 20px;position: relative;top: 4px;">Employees Management System</p>
        <p style="color: rgb(220, 205, 205);font-size: 10px;position: relative;bottom: 3px;">Explore Our Company Employees and Thier Details </p>
    </div>
    <div class="content">
        <div class="content-upper">
            <a href="/"><button>Home</button></a>
            <a href="/employee"><button>All</button></a>
            <a href="/employee?gend=male"><button>Men's</button></a>
            <a href="/employee?gend=female"><button>Women's</button></a>
            <a href="/department"><button>Department</button></a>
        </div>
        <div class="content-lower">
                {% for emp in emps %}
                <div class="card">
                    <div class="pic">
                        <img src="{{emp[3]}}" alt="">
                    </div>
                    <button class="line"></button>
                    <p class="idtxt">Emp Id : {{emp[0]}}</p>
                    <p class="name">Name : {{emp[1]}}</p>
                    
                    <p class="dept">Dept : {{emp[5]}}</p>
                    <!-- {% if emp[8] %}
                       <button class="attendstatus" style="color: rgb(1, 109, 1); background-color: rgb(172, 203, 172);">&#10003; On Duty</button>
                    {% else %}
                       <button class="attendstatus" style="color: rgb(166, 12, 12); background-color: rgb(174, 147, 147);">&#10007; Leave</button>
                    {% endif %} -->
                    <a href="/employee/{{emp[0]}}"><button class="view" >View Details &rarr;</button></a>
                    <div style="display: flex;justify-content: space-between;gap: 10px;">
                         <form action="/employee/{{emp[0]}}" method="post"><button class="viewb" >Delete</button></form>
                         <form action="/employee/update/{{emp[0]}}"><button class="viewb" >Update</button></form>
                    </div>
                   
                </div>        
                {% endfor %}   
    </div>
</body>
</html>
