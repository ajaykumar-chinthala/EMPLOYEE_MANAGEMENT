<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
      *{
        margin: 0px;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        
        }
        .body{
            width: 100%;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .nav{
            width: 100%;
            height: 70px;
            background-color: rgb(16, 19, 45);
            margin: 0px;
            position:fixed;
            top: 0px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            text-align: center;
        }
        .content{
            width: 100%;
            height: 100px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
            
        }
        .content button{
            background-color: rgb(22, 22, 31);
            border: 1px solid rgb(39, 37, 37);
            border-radius: 40px;
            padding: 8px 20px ;
            font-size: 14px;
            color: rgb(255, 255, 255);
            position: relative;
            top: 8px;
            cursor: pointer;
            transition: 0.15s ease;

        }
        .content button:active{
            background-color:  rgb(47, 47, 143);
            color: white;
        }
</style>
<body>
    <div class="nav">
            <p style="color: white;font-weight: bold;font-size: 20px;position: relative;top: 4px;">Employees Management System</p>
            <p style="color: rgb(220, 205, 205);font-size: 10px;position: relative;bottom: 3px;">Explore Our Company Employees and Thier Details </p>
        </div>
    <div class="body">
        
        <div class="content">
            <a href="/employee"><button>Visit Employees</button></a>
            <a href="/emp/add"><button>+ADD EMP</button></a>
        </div>
    </div>
    
    
</body>
</html>
