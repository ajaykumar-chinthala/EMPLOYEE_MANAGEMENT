<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            background-color: aliceblue;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .cont{
            width: 350px;
            height: 450px;
            /* border: 2px solid grey; */
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            background-color: rgb(234, 224, 224);
            box-shadow: 0px 5px 5px gray;
            position: fixed;
            top: 120px;
        }
        .form{
            width: 100%;
            height: 100%;
            /* border: 2px solid grey; */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        
        }
        input,select {
            padding: 6px 10px 6px 10px;
            border-radius: 5px;
            border: none;
            box-shadow: 1px 3px 2px lightgray;
            cursor: pointer;
        }
        
        button{
            background-color: rgb(22, 22, 31);
            border: 1px solid rgb(39, 37, 37);
            border-radius: 40px;
            padding: 8px 20px ;
            font-size: 14px;
            color: rgb(255, 255, 255);
            position: relative;
            top: 8px;
            cursor: pointer;
            transition: 0.15s ease;
    
        }
        label{
            font-weight: bold ;
            font-size: 17px;
            cursor: pointer;
        }
        h1{
            position: fixed;
            top: 5px;
            
        }
    </style>
</head>
<body>
    <h1>EMPLOYEE REGISTRATION <br> FORM</h1>
    <div class="cont">
        <form action="/emp/add" method="post" class="form">
        <label for="name">Name : <input type="text" name="name" id="name" placeholder="Enter emp Name" required></label>
        
        <label for="gender">Gender :  <select name="gender" id="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select></label>
       
        <label for="im">Image : <input type="text" name="image" id="im" placeholder="Share emp Image" required></label>
        
        <label for="sal">Salary : <input type="text" id="sal" name="salary" placeholder="Enter emp Salary" required></label>
        
        <label for="dept">Department : <select name="department" id="dept" required >
            <option value="">Select Role/Dept</option>
            <option value="Data Analyst">Data Analyst</option>
            <option value="HR">HR</option>
            <option value="Software Developer">Software Developer</option>
            <option value="DevOps">DevOps</option>
            <option value="AI Engineer">AI Engineer</option>
            <option value="Data Science">Data Science</option>
        </select></label>
        
        <label for="exp">Experience :  <input type="text" name="experience" placeholder="Enter emp Experience" id="exp" required></label>
    

        <label for="att">Attendance : 
            <select name="attendance" id="att">
                <option value="0">ABSENT</option>
                <option value="1">PRESENT</option>
            </select>
        </label>
        
        <a href="/employee"><button>submit</button></a>
        </form>
    </div>
</body>
</html>
