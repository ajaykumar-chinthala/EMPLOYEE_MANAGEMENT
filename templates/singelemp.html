<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
                
            display: flex;
            align-items: center;
            justify-content: center;
          
        }
        .cont{
            width: 99%;
            height: 530px;
            /* border: 1px solid red; */
            display: flex;
            align-items: center;
            position: fixed;
            top: 30px;
            
        }
        .card{
            width: 80%;
            height: 76%;
            /* border: 2px solid gray; */
            border-radius: 120px;
            padding: 10px 30px 20px 30px;
            background-color: rgb(255, 253, 253);
            /* margin-bottom: 40px; */
            padding-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 1px 2px 5px gray;
            margin-left: 90px;

        }
        .pic{
            width: 33%;
            height: 80%;
            background-color: rgb(241, 239, 239);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pic img{
            width: 90%;
            height: 90%;
            border-radius: 50%;
        }
        .info{
            width: 60%;
            height: 78%;
            display: flex;
            justify-content: space-between; 
            flex-direction: column;
            border-radius: 100px;
            background-color: rgb(251, 247, 247);
            padding: 0px 20px ;

        }
        .idtxt{
            color:rgb(123, 125, 143);
            font-weight: bold;
            font-size: 15px;   
            line-height: 15px;   
           
        }
        .name {
            color:rgb(22, 23, 36);
            font-weight: bold;
            font-size: 30px;      
            line-height: 15px;
            text-align: center;
        }
        .line{
            width: 99.5%;
            border: 0.5px solid rgb(184, 182, 182);
            border-left: none;
            border-bottom: none;
            border-right: none;

        }
        .gend{
            font-size: 15px;
            color: rgb(123, 122, 122);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 15px; 
            font-weight: bold;
        }
        .exp{
            font-size: 15px;
            font-weight: bold;
            color:rgb(123, 122, 122);
            line-height: 15px; 
            
        }
         .dept{
            font-size: 15px;
            font-weight: bold;
            color:rgb(123, 122, 122);
            line-height: 15px; 
            
        }
        
        .attendstatus{
            padding: 5px 20px 7px 20px;
            font-size: 11px;
            border-radius: 40px;
            border: none;
            width: max-content;
            display: flex;
            align-items: center;
            text-align: center;
            position: relative;
            bottom: 175px;
            left: 240px;
           

        }
        .Role{
            font-size: 15px;
            font-weight: bold;
            color:rgb(123, 122, 122);
            line-height: 15px;
        }
        .Salary{
            font-size: 15px;
            font-weight: bold;
            color:rgb(123, 122, 122);
            line-height: 15px; 
        }
        .view{
            font-weight: bold;
            font-size: 12px;
            color: white;
            background-color: rgb(26, 26, 37);
            padding: 8px 50px 8px 45px;
            border: none;
            border-radius: 10px;
            transition: opacity 0.15s;
            cursor: pointer;
            width: max-content;
            display: flex;
            align-items: center;
            text-align: center;
            position: relative;
            left: 210px;
            bottom: 30px;
           
        }
        .view:active{
          opacity: 0.3;
        }
        .cl{
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .cr{
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }
        .c{
            display: flex;
            justify-content: space-around;
            position: relative;
            top: 20px;
        }
       
    </style>
</head>
<body style="background-color: rgb(241, 239, 239);">
    <div class="cont">
        <div class="card">
                        <div class="pic">
                            <img src="{{emp[3]}}" alt="">
                        </div>
                        <div class="info">
                        <p class="name">{{emp[1]}}</p>
                        <div class="c">
                            <div class="cl">
                                
                                <p class="idtxt">Emp Id : {{emp[0]}}</p>
                                <p class="dept">Department : {{emp[5]}}</p>
                                <p class="gend">Gender : {{emp[2]}}</p>
                            </div>
                            <div class="cr">
                                
                                <p class="exp">Experience : {{emp[6]}} Years</p>
                                <p class="Salary">Salary : ₹ {{emp[4]}}</p>
                
                            </div>
                        </div>
                        
                        {% if emp[7] %}
                        <button class="attendstatus" style="color: rgb(1, 109, 1); background-color: rgb(172, 203, 172);">&#10003; On Duty</button>
                        {% else %}
                        <button class="attendstatus" style="color: rgb(166, 12, 12); background-color: rgb(174, 147, 147);">&#10007; In Leave</button>
                        {% endif %}
                    
                        <a href="/department" style="text-decoration: none;"><button class="view" > ← Back </button></a>
                        </div>
                    </div>   
    </div> 
</body>
</html>
